<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Smart Plumbing</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background:
            radial-gradient(circle at 15% 20%, rgba(20, 102, 173, 0.15), transparent 45%),
            radial-gradient(circle at 85% 80%, rgba(20, 184, 166, 0.15), transparent 45%),
            linear-gradient(135deg, #e8f0fa 0%, #f4f8fc 100%);
        overflow: hidden;
        position: relative;
    }

    /* Floating bubbles in the background */
    body::before, body::after {
        content: '';
        position: absolute;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(20,102,173,0.10), rgba(20,184,166,0.10));
        animation: float 12s ease-in-out infinite;
    }
    body::before { width: 260px; height: 260px; top: -80px; left: -80px; }
    body::after  { width: 340px; height: 340px; bottom: -120px; right: -120px; animation-delay: 3s; }

    @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); }
        50%      { transform: translate(30px, -20px) scale(1.08); }
    }

    .login-box {
        position: relative;
        z-index: 1;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(14px);
        padding: 44px 38px;
        border-radius: 20px;
        box-shadow:
            0 10px 40px rgba(20, 102, 173, 0.12),
            0 2px 8px rgba(0, 0, 0, 0.04);
        width: 100%;
        max-width: 400px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        animation: rise 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes rise {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo badge at the top */
    .logo-badge {
        width: 56px;
        height: 56px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1466ad 0%, #1e7fd1 100%);
        border-radius: 16px;
        font-size: 28px;
        box-shadow: 0 6px 18px rgba(20, 102, 173, 0.35);
    }

    h1 {
        font-size: 26px;
        color: #0f172a;
        text-align: center;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
    }

    .subtitle {
        text-align: center;
        color: #64748b;
        font-size: 14px;
        margin-bottom: 28px;
    }

    label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
        margin-top: 16px;
    }

    .input-wrap {
        position: relative;
    }

    .input-wrap .icon {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        opacity: 0.55;
        pointer-events: none;
    }

    input {
        width: 100%;
        padding: 12px 14px 12px 42px;
        border: 1.5px solid #e2e8f0;
        background: #f8fafc;
        border-radius: 10px;
        font-size: 14px;
        color: #0f172a;
        transition: all 0.2s ease;
    }

    input:focus {
        outline: none;
        border-color: #1466ad;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(20, 102, 173, 0.10);
    }

    input::placeholder { color: #94a3b8; }

    .forgot-link {
        display: block;
        text-align: right;
        font-size: 13px;
        color: #1466ad;
        text-decoration: none;
        margin-top: 10px;
        font-weight: 500;
    }

    .forgot-link:hover { text-decoration: underline; }

    button {
        width: 100%;
        background: linear-gradient(135deg, #1466ad 0%, #1e7fd1 100%);
        color: #fff;
        padding: 13px;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 22px;
        box-shadow: 0 6px 16px rgba(20, 102, 173, 0.28);
        transition: all 0.2s ease;
        letter-spacing: 0.02em;
    }

    button:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(20, 102, 173, 0.36);
    }

    button:active { transform: translateY(0); }

    #loginMsg {
        font-size: 13px;
        text-align: center;
        margin-top: 12px;
        min-height: 18px;
    }

    .divider {
        display: flex;
        align-items: center;
        margin: 24px 0 18px;
        color: #cbd5e1;
        font-size: 12px;
    }
    .divider::before,
    .divider::after {
        content: '';
        flex: 1;
        height: 1px;
        background: #e2e8f0;
    }
    .divider span { padding: 0 12px; color: #94a3b8; }

    .bottom-text {
        text-align: center;
        font-size: 14px;
        color: #64748b;
    }

    .bottom-text a {
        color: #1466ad;
        text-decoration: none;
        font-weight: 600;
    }

    .bottom-text a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="login-box">

    <div class="logo-badge">🔧</div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to manage your plumbing services</p>

    <form id="loginForm">

        <label>Email</label>
        <div class="input-wrap">
            <span class="icon">✉️</span>
            <input type="email" name="email" required placeholder="you@example.com">
        </div>

        <label>Password</label>
        <div class="input-wrap">
            <span class="icon">🔒</span>
            <input type="password" name="password" required placeholder="Enter your password">
        </div>

        <a href="forgot.html" class="forgot-link">Forgot Password?</a>

        <button type="submit">Login</button>

        <p id="loginMsg"></p>

    </form>

    <div class="divider"><span>OR</span></div>

    <p class="bottom-text">
        Don't have an account? <a href="register.html">Create one</a>
    </p>

</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('loginMsg');
    msg.textContent = 'Logging in...';
    msg.style.color = '#64748b';

    const form = e.target;
    const body = new URLSearchParams();
    body.append('email', form.email.value);
    body.append('password', form.password.value);

    try {
        const res = await fetch('auth.php?action=login', {
            method: 'POST',
            body: body
        });
        const data = await res.json();

        if (!data.success) {
            msg.textContent = data.message || 'Login failed';
            msg.style.color = '#ef4444';
            return;
        }

        msg.textContent = '✓ Success! Redirecting...';
        msg.style.color = '#10b981';

        let page = 'user-dashboard.html';
        if (data.role === 'admin')   page = 'admin-dashboard.html';
        if (data.role === 'plumber') page = 'plumber-dashboard.html';

        setTimeout(() => { window.location.href = page; }, 600);

    } catch (err) {
        msg.textContent = 'Network error: ' + err.message;
        msg.style.color = '#ef4444';
    }
});
</script>

</body>
</html>
